<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyLink · Transmisor</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui}
  .container{text-align:center;padding:20px}
  #miId{background:#1a1a1a;color:#0f0;padding:15px;border-radius:12px;font-family:monospace;font-size:14px;margin:20px 0;word-break:break-all}
  button{background:#2563eb;color:#fff;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:bold;margin:8px;cursor:pointer}
  button:active{transform:scale(0.96)}
  #copyBtn{background:#10b981}
  #stopBtn{background:#ef4444;display:none}
  .status{padding:10px;margin:10px;border-radius:10px;color:#fff}
  .live{background:#ef4444}
  .idle{background:#374151}
  video{display:none}
</style>
</head>
<body>
<div class="container">
  <h2 style="color:#fff">📡 EasyLink Transmisor</h2>
  <div id="miId" style="display:none"></div>
  <div class="status idle" id="status">⚪ Desconectado</div>
  <button id="startBtn">🎬 Iniciar Transmisión</button>
  <button id="copyBtn" style="display:none">📋 Copiar ID</button>
  <button id="stopBtn">⏹ Detener</button>
</div>

<script>
let peer = null;
let myId = null;
let mediaStream = null;
let activeCalls = {};

const startBtn = document.getElementById('startBtn');
const copyBtn = document.getElementById('copyBtn');
const stopBtn = document.getElementById('stopBtn');
const statusDiv = document.getElementById('status');
const miIdDiv = document.getElementById('miId');

startBtn.onclick = async () => {
  try {
    statusDiv.textContent = '🎥 Solicitando pantalla...';
    mediaStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: false
    });
    
    if(peer) peer.destroy();
    
    peer = new Peer();
    
    peer.on('open', id => {
      myId = id;
      miIdDiv.textContent = `📱 ID DEL TRANSMISOR:\n${id}`;
      miIdDiv.style.display = 'block';
      copyBtn.style.display = 'inline-block';
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      statusDiv.className = 'status live';
      statusDiv.textContent = '🔴 TRANSMITIENDO EN VIVO';
    });
    
    peer.on('connection', conn => {
      conn.on('open', () => {
        if(mediaStream) {
          const call = peer.call(conn.peer, mediaStream);
          activeCalls[conn.peer] = call;
        }
      });
    });
    
    peer.on('call', call => {
      if(mediaStream) {
        call.answer(mediaStream);
        activeCalls[call.peer] = call;
      } else {
        call.close();
      }
    });
    
    mediaStream.getTracks().forEach(t => {
      t.onended = () => detener();
    });
    
  } catch(e) {
    alert('Error: ' + e.message);
    statusDiv.textContent = '❌ Error al capturar pantalla';
  }
};

copyBtn.onclick = () => {
  if(myId) {
    navigator.clipboard.writeText(myId);
    alert('✅ ID copiado: ' + myId);
  }
};

function detener() {
  if(mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if(peer) peer.destroy();
  peer = null;
  startBtn.style.display = 'inline-block';
  copyBtn.style.display = 'none';
  stopBtn.style.display = 'none';
  miIdDiv.style.display = 'none';
  statusDiv.className = 'status idle';
  statusDiv.textContent = '⚪ Transmisión detenida';
}

stopBtn.onclick = detener;
</script>
</body>
</html>
