<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#060910">
    <title>EasyLink · Receptor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #060910;
            --s1: #0d1117;
            --s2: #161c26;
            --s3: #1e2736;
            --border: rgba(255,255,255,.08);
            --border2: rgba(255,255,255,.15);
            --primary: #2563eb;
            --primary-glow: rgba(37,99,235,.45);
            --green: #10b981;
            --green-glow: rgba(16,185,129,.35);
            --red: #ef4444;
            --red-glow: rgba(239,68,68,.4);
            --text: #e2e8f0;
            --muted: #64748b;
            --font: 'Space Grotesk', sans-serif;
        }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Contenedor principal del video */
        #video-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Muestra toda la pantalla sin recortar */
            background: #000;
            display: none;
        }
        #remote-video.playing { display: block; }

        /* Pantalla de espera (cuando no hay señal) */
        #idle-screen {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 32px;
            transition: opacity 0.5s;
            pointer-events: auto;
        }
        #idle-screen.gone {
            opacity: 0;
            pointer-events: none;
        }
        .receptor-icon {
            width: 80px; height: 80px; border-radius: 24px;
            background: var(--s2); border: 2px solid var(--border2);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2); }
            50% { box-shadow: 0 0 45px var(--primary-glow); }
        }
        .receptor-title { font-size: 22px; font-weight: 700; color: var(--muted); }
        .receptor-title span { color: #60a5fa; }
        .receptor-sub {
            font-size: 14px; color: var(--muted); text-align: center;
            line-height: 1.7; max-width: 260px;
        }
        .reconnect-btn {
            padding: 14px 32px; border-radius: 14px;
            background: var(--primary); color: #fff;
            font-size: 14px; font-weight: 700; border: none;
            cursor: pointer; font-family: var(--font);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 24px var(--primary-glow);
            transition: transform 0.15s; -webkit-appearance: none;
        }
        .reconnect-btn:active { transform: scale(0.95); }

        /* Overlay superior */
        #top-overlay {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 10;
            padding-top: max(env(safe-area-inset-top), 12px);
            padding-left: 16px; padding-right: 16px; padding-bottom: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
            display: flex; align-items: center; justify-content: space-between;
            pointer-events: none;
        }
        .top-brand {
            display: flex; align-items: center; gap: 8px;
            pointer-events: none;
        }
        .top-icon {
            width: 28px; height: 28px; border-radius: 8px;
            background: var(--primary);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 14px var(--primary-glow);
        }
        .top-name { font-size: 13px; font-weight: 700; color: #fff; }
        .top-name span { color: #60a5fa; }

        /* Status pill */
        #status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 99px;
            font-size: 10px; font-weight: 700; letter-spacing: .07em;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all .3s; pointer-events: none;
        }
        #status-pill.idle {
            background: rgba(100,116,139,.25);
            border: 1px solid rgba(100,116,139,.3);
            color: #94a3b8;
        }
        #status-pill.connected {
            background: rgba(16,185,129,.8);
            border: 1px solid rgba(16,185,129,.5);
            color: #fff;
            box-shadow: 0 2px 12px var(--green-glow);
        }
        #status-pill.error {
            background: rgba(239,68,68,.85);
            border: 1px solid rgba(239,68,68,.5);
            color: #fff;
            box-shadow: 0 2px 12px var(--red-glow);
        }
        .pill-dot {
            width: 7px; height: 7px; border-radius: 50%; background: currentColor;
        }
        #status-pill.connected .pill-dot { animation: blink .8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

        /* Toast */
        #toast {
            position: fixed; top: max(env(safe-area-inset-top), 70px);
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: rgba(30,39,54,.96);
            border: 1px solid var(--border2);
            color: var(--text); border-radius: 12px;
            padding: 10px 20px; font-size: 12px; font-weight: 500;
            z-index: 100; pointer-events: none; opacity: 0;
            white-space: nowrap;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,.6);
            transition: opacity .25s, transform .25s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="video-container">
    <video id="remote-video" autoplay playsinline controls></video>
</div>

<div id="idle-screen">
    <div class="receptor-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
    </div>
    <div class="receptor-title">Easy<span>Link</span></div>
    <div class="receptor-sub" id="status-text">Esperando conexión con el transmisor...</div>
    <button class="reconnect-btn" onclick="conectar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Reconectar
    </button>
</div>

<div id="top-overlay">
    <div class="top-brand">
        <div class="top-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
        </div>
        <div class="top-name">Easy<span>Link</span> · Receptor</div>
    </div>
    <div id="status-pill" class="idle">
        <div class="pill-dot"></div>
        <span id="status-txt">Esperando...</span>
    </div>
</div>

<div id="toast"></div>

<script>
    // ══ CONFIGURACIÓN ═══════════════════════════
    // Obtiene el ID del transmisor de la URL: ?host=XXXXX
    const urlParams = new URLSearchParams(window.location.search);
    const HOST_ID = urlParams.get('host');
    // ═══════════════════════════════════════════

    let peer = null;
    let currentCall = null;
    let _tt = null;

    // Elementos del DOM
    const videoEl = document.getElementById('remote-video');
    const idleScreen = document.getElementById('idle-screen');
    const statusPill = document.getElementById('status-pill');
    const statusTxt = document.getElementById('status-txt');
    const statusTextEl = document.getElementById('status-text');

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg; el.classList.add('show');
        clearTimeout(_tt);
        _tt = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function setStatus(cls, txt) {
        statusPill.className = cls;
        statusTxt.textContent = txt;
    }

    // Función principal para iniciar la conexión con el transmisor
    async function conectar() {
        if (!HOST_ID) {
            toast('❌ No se encontró ID del transmisor en la URL');
            setStatus('error', 'Error: falta host');
            statusTextEl.textContent = 'Error: Agrega ?host=ID a la URL';
            return;
        }

        // Limpiar conexión anterior si existe
        if (peer) {
            peer.destroy();
            peer = null;
        }
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }

        videoEl.classList.remove('playing');
        idleScreen.classList.remove('gone');
        setStatus('idle', 'Conectando...');
        statusTextEl.textContent = 'Conectando con el transmisor...';

        try {
            // Inicializar PeerJS (receptor anónimo)
            peer = new Peer({
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'turn:a.relay.metered.ca:80', username: 'open', credential: 'open' },
                        { urls: 'turn:a.relay.metered.ca:443', username: 'open', credential: 'open' },
                        { urls: 'turn:a.relay.metered.ca:443?transport=tcp', username: 'open', credential: 'open' }
                    ],
                    iceCandidatePoolSize: 5
                }
            });

            peer.on('open', function(myId) {
                // Conectar con el transmisor vía canal de datos (para anunciarnos)
                const conn = peer.connect(HOST_ID, { reliable: true });
                
                conn.on('open', function() {
                    // Enviar mensaje de "hola" para que el transmisor sepa que llegamos
                    conn.send({
                        type: 'viewer-hello',
                        name: 'Cliente ' + myId.substring(0, 5)
                    });
                    toast('👋 Conectado, esperando video...');
                    statusTextEl.textContent = 'Solicitando transmisión en vivo...';
                });

                conn.on('error', function(err) {
                    console.warn('Error en canal de datos:', err);
                });
            });

            // Escuchar llamadas entrantes del transmisor
            peer.on('call', function(call) {
                // Contestar automáticamente
                call.answer(); // No enviamos stream propio, solo recibimos
                
                currentCall = call;
                
                call.on('stream', function(remoteStream) {
                    // ¡Recibimos el video/audio en tiempo real!
                    videoEl.srcObject = remoteStream;
                    videoEl.classList.add('playing');
                    idleScreen.classList.add('gone');
                    setStatus('connected', 'EN VIVO');
                    statusTextEl.textContent = 'Recibiendo transmisión...';
                    toast('✅ Transmisión en vivo recibida');
                });

                call.on('close', function() {
                    videoEl.classList.remove('playing');
                    idleScreen.classList.remove('gone');
                    setStatus('idle', 'Transmisión finalizada');
                    statusTextEl.textContent = 'El transmisor detuvo la demo.';
                    toast('⏹️ Transmisión terminada');
                });

                call.on('error', function(err) {
                    console.warn('Error en llamada:', err);
                    setStatus('error', 'Error de conexión');
                    statusTextEl.textContent = 'Error en la transmisión. Intenta reconectar.';
                    toast('⚠️ Error en la transmisión');
                });
            });

            peer.on('error', function(err) {
                console.warn('Error de Peer:', err);
                setStatus('error', 'Error de red');
                statusTextEl.textContent = 'No se pudo contactar al transmisor.';
                toast('❌ No se pudo contactar al transmisor');
            });

        } catch (e) {
            console.error(e);
            setStatus('error', 'Error grave');
            toast('❌ Error al iniciar conexión');
        }
    }

    // Arranque automático
    if (HOST_ID) {
        conectar();
    } else {
        statusTextEl.textContent = 'Espera el link del transmisor (contiene ?host=...)';
    }

    // Limpiar al cerrar pestaña
    window.addEventListener('beforeunload', function() {
        if (peer) peer.destroy();
    });
</script>
</body>
</html>
