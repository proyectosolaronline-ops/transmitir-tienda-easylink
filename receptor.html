<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EasyLink · Receptor</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;height:100vh}
  video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  .overlay{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    text-align:center;
    background:rgba(0,0,0,0.6);
    color:#fff;
    padding:12px;
    font-family:monospace;
    z-index:10;
  }
  input{
    padding:10px;
    width:80%;
    max-width:300px;
    border-radius:8px;
    border:none;
    text-align:center;
    font-size:14px;
  }
  button{
    padding:10px 20px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    margin-left:8px;
    cursor:pointer;
  }
  .error{
    color:#ff6666;
    font-size:12px;
    margin-top:8px;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div class="overlay" id="overlay">
  <div>
    <input type="text" id="hostId" placeholder="PEGA EL ID DEL TRANSMISOR" autocomplete="off">
    <button id="conectarBtn">🔗 CONECTAR</button>
  </div>
  <div id="errorMsg" class="error"></div>
  <div id="statusMsg" style="font-size:11px;margin-top:8px;color:#aaa"></div>
</div>

<script>
const video = document.getElementById('video');
const hostIdInput = document.getElementById('hostId');
const conectarBtn = document.getElementById('conectarBtn');
const errorMsg = document.getElementById('errorMsg');
const statusMsg = document.getElementById('statusMsg');
const overlay = document.getElementById('overlay');

let peer = null;
let activeCall = null;

function ocultarOverlay() {
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(() => overlay.style.display = 'none', 500);
}

conectarBtn.onclick = () => {
  const hostId = hostIdInput.value.trim();
  if(!hostId) {
    errorMsg.textContent = '❌ Ingresa el ID del transmisor';
    return;
  }
  
  errorMsg.textContent = '';
  statusMsg.textContent = '🔄 Conectando...';
  
  if(peer) peer.destroy();
  
  peer = new Peer();
  
  peer.on('open', () => {
    statusMsg.textContent = '📡 Conectando al transmisor...';
    const conn = peer.connect(hostId);
    
    conn.on('open', () => {
      statusMsg.textContent = '✅ Conectado, esperando video...';
    });
    
    conn.on('error', (e) => {
      errorMsg.textContent = '⚠️ Error de conexión';
      statusMsg.textContent = '';
    });
  });
  
  peer.on('call', (call) => {
    statusMsg.textContent = '📺 Recibiendo pantalla...';
    call.answer();
    call.on('stream', (stream) => {
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.play().then(() => {
        statusMsg.textContent = '✅ TRANSMISIÓN ACTIVA';
        ocultarOverlay();
      }).catch(e => {
        video.muted = true;
        video.play();
        ocultarOverlay();
      });
    });
    activeCall = call;
  });
  
  peer.on('error', (e) => {
    errorMsg.textContent = '❌ No se pudo conectar. ¿El transmisor está activo?';
    statusMsg.textContent = '';
  });
  
  // Timeout
  setTimeout(() => {
    if(!activeCall) {
      errorMsg.textContent = '⏰ El transmisor no respondió. Verifica el ID.';
      statusMsg.textContent = '';
    }
  }, 10000);
};

// Para que el overlay se oculte bien en pantalla completa
document.addEventListener('fullscreenchange', () => {
  if(document.fullscreenElement) {
    overlay.style.display = 'none';
  } else if(overlay.style.opacity === '0') {
    overlay.style.display = 'flex';
    setTimeout(() => overlay.style.opacity = '1', 100);
  }
});
</script>
</body>
</html>
