<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EasyLink - Receptor de Pantalla</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
        }
        
        #screenVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #ff0;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .error {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            display: none;
            z-index: 100;
        }
        
        @media (max-width: 768px) {
            .info, .status {
                font-size: 10px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="screenVideo" autoplay playsinline muted></video>
        <div class="info">
            🖥️ RECEPTOR DE PANTALLA | EasyLink
        </div>
        <div class="status" id="status">
            🔄 Conectando...
        </div>
        <div class="error" id="errorMsg">
            ⚠️ Error
        </div>
    </div>

    <!-- Cargar EasyLink (ajusta la ruta según donde tengas la librería) -->
    <script src="https://cdn.jsdelivr.net/npm/easylink@latest/dist/easylink.min.js"></script>
    
    <script>
        (function() {
            // Elementos del DOM
            const videoElement = document.getElementById('screenVideo');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('errorMsg');
            
            // Configuración - AQUÍ PON EL ID DEL HOST (emisor)
            const HOST_ID = '1d10ae39-df24-4d03-81dc-aa1e16d08d68';  // el ID de tu emisor
            
            let easyLink = null;
            let connectionActive = false;
            
            // Función para mostrar estado
            function setStatus(text, isError = false) {
                statusDiv.innerHTML = text;
                statusDiv.style.color = isError ? '#ff6666' : '#ffff00';
                console.log(`[Status] ${text}`);
            }
            
            // Función para mostrar error temporal
            function showError(text) {
                errorDiv.textContent = `⚠️ ${text}`;
                errorDiv.style.display = 'block';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
                console.error(`[Error] ${text}`);
            }
            
            // Inicializar EasyLink
            function initEasyLink() {
                try {
                    // Configurar EasyLink SOLO para recibir video/pantalla
                    const config = {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    };
                    
                    easyLink = new EasyLink(config);
                    
                    // Evento: cuando se recibe un stream (¡LA PARTE IMPORTANTE!)
                    easyLink.on('stream', (stream, connectionId) => {
                        console.log('📺 Stream recibido de:', connectionId);
                        setStatus('📺 Recibiendo pantalla...');
                        
                        // 🔥 SOLUCIÓN CLAVE PARA AUTOPLAY 🔥
                        // Forzar que solo se usen las pistas de VIDEO (ignorar cualquier audio)
                        const videoTracks = stream.getVideoTracks();
                        const audioTracks = stream.getAudioTracks();
                        
                        console.log(`🎥 Pistas de video: ${videoTracks.length}`);
                        console.log(`🎤 Pistas de audio: ${audioTracks.length} (ignoradas)`);
                        
                        // Si hay pistas de audio, las eliminamos (por si acaso)
                        audioTracks.forEach(track => {
                            stream.removeTrack(track);
                            track.stop();
                            console.log('🔇 Pista de audio eliminada');
                        });
                        
                        // Crear un stream nuevo SOLO con video
                        const soloVideoStream = new MediaStream(videoTracks);
                        
                        // Asignar al elemento video
                        videoElement.srcObject = soloVideoStream;
                        
                        // Asegurar muted y playsinline (evita autoplay policy)
                        videoElement.muted = true;
                        videoElement.playsInline = true;
                        
                        // Reproducir (con manejo de errores)
                        const playPromise = videoElement.play();
                        
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                setStatus('✅ Pantalla en VIVO', false);
                                connectionActive = true;
                                console.log('✅ Reproducción iniciada correctamente');
                            }).catch(error => {
                                console.error('❌ Error al reproducir:', error);
                                setStatus('❌ Error de reproducción', true);
                                showError(`No se pudo reproducir: ${error.message}`);
                                
                                // Intentar solución alternativa: pedir interacción manual
                                showManualPlayButton();
                            });
                        }
                    });
                    
                    // Evento: cuando se cierra la conexión
                    easyLink.on('close', (connectionId) => {
                        console.log('🔌 Conexión cerrada:', connectionId);
                        setStatus('⏹️ Conexión finalizada');
                        connectionActive = false;
                        videoElement.srcObject = null;
                    });
                    
                    // Evento: errores generales
                    easyLink.on('error', (error) => {
                        console.error('Error general:', error);
                        showError(`Error: ${error.message || 'Conexión fallida'}`);
                        setStatus('⚠️ Error de conexión', true);
                    });
                    
                    // Conectar al host (emisor)
                    setStatus('🔄 Conectando al host...');
                    console.log(`🔗 Intentando conectar a: ${HOST_ID}`);
                    
                    easyLink.connect(HOST_ID).then(() => {
                        setStatus('🔗 Conectado, esperando stream...');
                        console.log('✅ Conexión establecida, esperando stream de pantalla');
                    }).catch((error) => {
                        console.error('Error al conectar:', error);
                        setStatus('❌ No se pudo conectar', true);
                        showError(`No se pudo conectar al host: ${error.message}`);
                    });
                    
                } catch (error) {
                    console.error('Error al inicializar EasyLink:', error);
                    setStatus('❌ Error de inicialización', true);
                    showError(`Error: ${error.message}`);
                }
            }
            
            // Botón manual de reproducción (solo por si falla todo)
            function showManualPlayButton() {
                const button = document.createElement('button');
                button.textContent = '▶️ Hacer clic para ver pantalla';
                button.style.position = 'fixed';
                button.style.bottom = '80px';
                button.style.left = '50%';
                button.style.transform = 'translateX(-50%)';
                button.style.padding = '12px 24px';
                button.style.backgroundColor = '#007aff';
                button.style.color = 'white';
                button.style.border = 'none';
                button.style.borderRadius = '8px';
                button.style.fontSize = '16px';
                button.style.zIndex = '200';
                button.style.cursor = 'pointer';
                button.style.fontWeight = 'bold';
                button.style.boxShadow = '0 2px 10px rgba(0,0,0,0.3)';
                
                button.onclick = () => {
                    if (videoElement.srcObject) {
                        videoElement.play().then(() => {
                            setStatus('✅ Pantalla en VIVO', false);
                            button.remove();
                        }).catch(e => {
                            showError(`Aún no se puede: ${e.message}`);
                        });
                    } else {
                        showError('No hay stream recibido aún');
                    }
                };
                
                document.body.appendChild(button);
                
                // Auto-remover después de 30 segundos
                setTimeout(() => {
                    if (button.parentNode) button.remove();
                }, 30000);
            }
            
            // Iniciar cuando la página esté lista
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initEasyLink);
            } else {
                initEasyLink();
            }
            
            // Limpiar al cerrar la página
            window.addEventListener('beforeunload', () => {
                if (easyLink) {
                    easyLink.destroy();
                }
                if (videoElement.srcObject) {
                    const tracks = videoElement.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                }
            });
            
        })();
    </script>
</body>
</html>
